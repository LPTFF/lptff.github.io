name: 定时数据采集与有效快照更新

on:
  schedule:
    # GitHub Actions 使用 UTC；除北京时间 06:17 外，每小时共同刷新福利、娱乐和热门资讯。
    - cron: "17 0-21,23 * * *"
    # 每天北京时间 06:17 保留一次全量采集，避免其他站点数据停止更新。
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: data-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: project-support/requirements-crawl.txt

      - name: 安装项目依赖
        run: |
          npm ci
          python -m pip install --requirement project-support/requirements-crawl.txt

      - name: 设置无头浏览器虚拟显示器
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes xvfb
          fi

      - name: 恢复历史已发布有效数据快照
        # 采集前先还原上一轮已验证的有效快照，采集失败或超时时保留历史快照，不破坏可用数据
        run: |
          git fetch --depth=1 origin python-crawl || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git archive --format=tar FETCH_HEAD | tar -xf - -C src/data || true
          fi

      - name: 执行外部站点数据采集与结构化验证
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KUAISHOU_COOKIE: ${{ secrets.KUAISHOU_COOKIE }}
          LEETCODE_COOKIE: ${{ secrets.LEETCODE_COOKIE }}
        run: |
          chmod +x project-support/build.sh
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" != "17 22 * * *" ]]; then
            xvfb-run -a ./project-support/build.sh \
              --hourly \
              --summary .artifacts/collectors/python-ci.json
          else
            xvfb-run -a ./project-support/build.sh --full --summary .artifacts/collectors/python-ci.json
          fi

      - name: AI 辅助分类安全社区生态信号
        continue-on-error: true
        run: python -B project-support/crawl/classify_52pojie_ecosystem.py --summary .artifacts/collectors/ecosystem.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: AI 辅助分类热门资讯生态信号
        continue-on-error: true
        run: python -B project-support/crawl/classify_guide_ecosystem.py --summary .artifacts/collectors/guide-ecosystem.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: AI 辅助分类福利信号
        # AI 服务不可用时降级为规则匹配，不让辅助模型阻断流程
        continue-on-error: true
        run: python -B project-support/crawl/filter_welfare_with_gemini.py --summary .artifacts/collectors/welfare-filter.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 汇总结算 AI 状态与通知异常
        if: always()
        continue-on-error: true
        run: >-
          python -B project-support/crawl/sendNotify.py
          --ai-status .artifacts/collectors/python-ci.json
          --ai-status .artifacts/collectors/ecosystem.json
          --ai-status .artifacts/collectors/guide-ecosystem.json
          --ai-status .artifacts/collectors/welfare-filter.json
        env:
          QYWX_KEY: ${{ secrets.QYWX_KEY }}

      - name: 重新验证留存福利数据
        run: python -B project-support/crawl/welfare/keyword_search.py --sanitize-only

      - name: 发布有效爬虫数据快照至 python-crawl
        # 仅在采集有效完成时推送 python-crawl 分支，使用受控白名单，防止敏感文件漏入
        if: ${{ !cancelled() }}
        run: |
          cd ./src/data/
          git config --global user.email "lptffhh@gmail.com"
          git config --global user.name "LPTFF"
          git config --global init.defaultBranch master
          git init
          git add *.json
          if [ -d "career" ]; then git add career/*.json; fi
          if [ -d "techForum" ]; then git add techForum/*.json; fi
          if [ -d "welfare" ]; then git add welfare/*.json; fi
          git commit -m "$(date +%F日%H时%M分%S秒)" || echo "No changes to commit"
          git push -f "https://LPTFF:${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:python-crawl || true

      - name: 微信通知采集完成状态
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 22 * * *' }}
        continue-on-error: true
        run: python -B ./project-support/crawl/sendNotify.py
        env:
          QYWX_KEY: ${{ secrets.QYWX_KEY }}

# Simple workflow for deploying static content to GitHub Pages
name: CI
on:
  push:
    branches:
      - master

  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 06:17 自动采集并发布。
    - cron: "17 22 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: project-support/requirements-crawl.txt
      - name: Install dependencies
        run: |
          npm install
          python -m pip install --requirement project-support/requirements-crawl.txt
      - name: Test public data collectors
        run: npm run test:collectors
      - name: Collect public RSS for Pages
        run: npm run collect:rss:site
      - name: Crawl and validate site data
        run: |
          chmod +x project-support/build.sh
          ./project-support/build.sh --full --summary .artifacts/collectors/python-ci.json
        env:
          KUAISHOU_COOKIE: ${{ secrets.KUAISHOU_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEETCODE_COOKIE: ${{ secrets.LEETCODE_COOKIE }}
      - name: Publish validated crawler data
        run: |
          cd ./src/data/
          git config --global user.email "lptffhh@gmail.com"
          git config --global user.name "LPTFF"
          git config --global init.defaultBranch master
          git init
          git add -A
          git commit -m "$(date +%F日%H时%M分%S秒)"
          git push -f "https://LPTFF:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:python-crawl
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: Notify crawl result
        continue-on-error: true
        run: python ./project-support/crawl/sendNotify.py
        env:
          QYWX_KEY: ${{ secrets.QYWX_KEY }}
      - name: Build
        run: |
          npm run build
      - name: Verify RSS in production build
        run: |
          test -s project-support/public/data/recommendArticleData.json
          test -s dist/data/recommendArticleData.json
          cmp project-support/public/data/recommendArticleData.json dist/data/recommendArticleData.json
      - name: Package investment assistant extension
        run: |
          node project-support/scripts/extension/build-zip.js
          test -s dist-extension/lptff-investment-assistant.zip
      - name: Publish investment assistant extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="extension-latest"
          release_title="LPTFF Investment Assistant (latest)"
          release_notes="自动发布于 commit $GITHUB_SHA，GitHub Actions run $GITHUB_RUN_ID。"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist-extension/lptff-investment-assistant.zip --clobber
            gh release edit "$release_tag" --title "$release_title" --notes "$release_notes" --latest
          else
            gh release create "$release_tag" dist-extension/lptff-investment-assistant.zip \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          fi
      - name: 404
        run: cp dist/index.html dist/404.html
      - name: Deploy
        run: |
          cd ./dist/
          echo lptff.github.io > CNAME
          echo > .nojekyll
          git config --global user.email "lptffhh@gmail.com"
          git config --global user.name "LPTFF"
          git config --global init.defaultBranch master
          git init
          git add -A
          git commit -m $(date +%F日%H时%M分%S秒)
          git push -f "https://LPTFF:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages
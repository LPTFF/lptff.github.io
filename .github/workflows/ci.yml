# Simple workflow for deploying static content to GitHub Pages
name: CI
on:
  push:
    branches:
      - master

  schedule:
    # GitHub Actions 使用 UTC；除北京时间 06:17 外，每小时刷新福利和热门资讯。
    - cron: "17 0-21,23 * * *"
    # 每天北京时间 06:17 保留一次全量采集，避免其他站点数据停止更新。
    - cron: "17 22 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: project-support/requirements-crawl.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --requirement project-support/requirements-crawl.txt
      - name: Type check
        run: npm run typecheck
      - name: Restore previously published crawler data
        if: github.event_name == 'schedule' && github.event.schedule != '17 22 * * *'
        run: |
          git fetch --depth=1 origin python-crawl
          git archive --format=tar FETCH_HEAD | tar -xf - -C src/data
      - name: Crawl and validate site data
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KUAISHOU_COOKIE: ${{ secrets.KUAISHOU_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEETCODE_COOKIE: ${{ secrets.LEETCODE_COOKIE }}
        run: |
          chmod +x project-support/build.sh
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" != "17 22 * * *" ]]; then
            ./project-support/build.sh \
              --only welfare \
              --only 0818tuan \
              --only 0818tuanTop \
              --only zhuanyes \
              --only zhuanyesTop \
              --only daydayzhuan \
              --only daydayzhuanTop \
              --only zhujiceping \
              --only keywordSearch \
              --only infzm \
              --only weibo \
              --only douyinHot \
              --summary .artifacts/collectors/python-ci.json
          else
            ./project-support/build.sh --full --summary .artifacts/collectors/python-ci.json
          fi
      - name: Analyze 52pojie ecosystem signals
        if: github.event_name != 'schedule' || github.event.schedule == '17 22 * * *'
        run: python -B project-support/crawl/classify_52pojie_ecosystem.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Keep only bank offers in welfare data
        run: python -B project-support/crawl/filter_welfare_with_gemini.py --require-key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Publish validated crawler data
        run: |
          cd ./src/data/
          git config --global user.email "lptffhh@gmail.com"
          git config --global user.name "LPTFF"
          git config --global init.defaultBranch master
          git init
          git add -A
          git commit -m "$(date +%F日%H时%M分%S秒)"
          git push -f "https://LPTFF:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:python-crawl
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: Notify crawl result
        if: github.event_name != 'schedule' || github.event.schedule == '17 22 * * *'
        continue-on-error: true
        run: python -B ./project-support/crawl/sendNotify.py
        env:
          QYWX_KEY: ${{ secrets.QYWX_KEY }}
      - name: Build
        run: |
          npm run build
      - name: Package investment assistant extension
        if: github.event_name != 'schedule' || github.event.schedule == '17 22 * * *'
        run: |
          node project-support/scripts/extension/build-zip.js
          test -s dist-extension/lptff-investment-assistant.zip
      - name: Publish investment assistant extension release
        if: github.event_name != 'schedule' || github.event.schedule == '17 22 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="extension-latest"
          release_title="LPTFF Investment Assistant (latest)"
          release_notes="自动发布于 commit $GITHUB_SHA，GitHub Actions run $GITHUB_RUN_ID。"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist-extension/lptff-investment-assistant.zip --clobber
            gh release edit "$release_tag" --title "$release_title" --notes "$release_notes" --latest
          else
            gh release create "$release_tag" dist-extension/lptff-investment-assistant.zip \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          fi
      - name: 404
        run: cp dist/index.html dist/404.html
      - name: Deploy
        run: |
          cd ./dist/
          echo lptff.github.io > CNAME
          echo > .nojekyll
          git config --global user.email "lptffhh@gmail.com"
          git config --global user.name "LPTFF"
          git config --global init.defaultBranch master
          git init
          git add -A
          git commit -m $(date +%F日%H时%M分%S秒)
          git push -f "https://LPTFF:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages

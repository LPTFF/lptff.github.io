<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>私密书签</title><link rel="stylesheet" href="private-bookmarks-settings.css" /></head>
<body><main>
<h1>私密书签</h1>
<p>用 GitHub 登录，就能读取私人仓库中的书签。登录和验证码都在 GitHub 完成。</p>
<div class="actions"><a class="primary" href="https://lptff.github.io/devtools/private-bookmarks" target="_blank" rel="noopener noreferrer">打开私密书签</a><a href="https://github.com/LPTFF/qinglongBackup" target="_blank" rel="noopener noreferrer">查看 GitHub 仓库</a></div>
<p class="hint">打开书签页面后，点击“打开 GitHub 读取”。备份会填入 GitHub 编辑器，由你确认保存。</p>
<hr /><h2>导入 Chrome 书签</h2><p>需要导入时再启用权限；导入只复制所选文件夹，不修改原书签。</p>
<button id="permissions" type="button">启用书签导入</button><p id="status" role="status" aria-live="polite"></p>
</main><script src="private-bookmarks-settings.js"></script></body></html>

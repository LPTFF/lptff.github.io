<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1235"/>
      <stop offset="50%" stop-color="#3b1d5c"/>
      <stop offset="100%" stop-color="#140d28"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="60%" stop-color="#ffc93a"/>
      <stop offset="100%" stop-color="#e08a12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="#2f2252" stroke-width="4"/>

  <!-- Sunset Sun Glow -->
  <circle cx="64" cy="62" r="38" fill="url(#sun)" filter="url(#glow)" opacity="0.85"/>

  <!-- Sunset stripes / Horizon -->
  <rect x="22" y="66" width="84" height="4" rx="2" fill="#1b1235" opacity="0.7"/>
  <rect x="26" y="74" width="76" height="5" rx="2.5" fill="#1b1235" opacity="0.8"/>
  <rect x="32" y="83" width="64" height="6" rx="3" fill="#1b1235" opacity="0.9"/>

  <!-- Central Showdown Star (Sheriff / Duel Badge) -->
  <g transform="translate(64, 52)">
    <!-- 8-pointed star -->
    <path d="M 0,-30 L 7,-10 L 28,-14 L 14,4 L 24,24 L 4,14 L -8,30 L -12,10 L -30,8 L -14,-4 L -24,-22 L -4,-12 Z" fill="url(#gold)" stroke="#1a1230" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="8" fill="#1a1230"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffe066"/>
  </g>

  <!-- Crossed revolvers / flashes accent -->
  <path d="M 28 100 L 40 88" stroke="#ffc93a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 100 L 88 88" stroke="#ffc93a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="26" cy="102" r="2.5" fill="#ff6a4a"/>
  <circle cx="102" cy="102" r="2.5" fill="#ff6a4a"/>
</svg>
